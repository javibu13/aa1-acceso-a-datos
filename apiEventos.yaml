openapi: 3.0.3
info:
  title: Eventos API
  description: API for managing events, activities, and participants
  version: 1.0.0
  contact:
    name: API Support
    email: support@apieventos.com

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /persons:
    get:
      summary: Get all persons (optionally filter by firstName, age or verified)
      operationId: getAllPersons
      tags:
        - Persons
      parameters:
        - name: firstName
          in: query
          required: false
          schema:
            type: string
          description: Filter persons by first name
        - name: age
          in: query
          required: false
          schema:
            type: integer
          description: Filter persons by age
        - name: verified
          in: query
          required: false
          schema:
            type: boolean
          description: Filter persons by verification status
      responses:
        "200":
          description: A list of persons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Add a new person
      operationId: createPerson
      tags:
        - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Person"
      responses:
        "201":
          description: Person added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonWithoutPass"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  
  /persons/{id}:
    get:
      summary: Get a person by ID
      operationId: getPersonById
      tags:
        - Persons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the person to retrieve
      responses:
        "200":
          description: Person found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonWithoutPass"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a person
      operationId: updatePerson
      tags:
        - Persons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the person to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Person"
      responses:
        "202":
          description: Person updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonWithoutPass"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Partially update a person
      operationId: partialUpdatePerson
      tags:
        - Persons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the person to partially update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Person"
      responses:
        "202":
          description: Person partially updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonWithoutPass"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a person
      operationId: deletePerson
      tags:
        - Persons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the person to delete
      responses:
        "202":
          description: Person deleted successfully
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /persons/conferences/{conferenceId}:
    get:
      summary: Get all persons registered for a conference
      operationId: getPersonsByConferenceId
