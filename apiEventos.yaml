openapi: 3.0.3
info:
  title: Eventos API
  description: API for managing events, activities, and participants
  version: 1.0.0
  contact:
    name: API Support
    email: support@apieventos.com

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /persons:
    get:
      summary: Get all persons (optionally filter by firstName, age or verified)
      operationId: getAllPersons
      tags:
        - Persons
      parameters:
        - name: firstName
          in: query
          required: false
          schema:
            type: string
          description: Filter persons by first name
        - name: age
          in: query
          required: false
          schema:
            type: integer
          description: Filter persons by age
        - name: verified
          in: query
          required: false
          schema:
            type: boolean
          description: Filter persons by verification status
      responses:
        "200":
          description: A list of persons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
              examples:
                lista_completa:
                  summary: Lista con varias personas
                  value:
                    - id: 1
                      firstName: "Javier"
                      lastName: "Sanz"
                      email: "correofalso123@apieventos.com"
                      age: 28
                      height: 1.75
                      interests: "Tech, 3D, videogames, etc"
                      birthDate: "1996-05-29"
                      verified: true
                    - id: 2
                      firstName: "Montse"
                      lastName: "García"
                      email: "correofalso321@apieventos.com"
                      age: 28
                      height: 1.58
                      interests: "Pixar, Disney, etc"
                      birthDate: "1996-07-11"
                      verified: false
                lista_vacia:
                  summary: No hay personas registradas
                  value: []
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                example1:
                  summary: Example of error response
                  value:
                    status: 500
                    error: "DataAccessResourceFailureException"
                    message: "An unexpected internal error occurred"
    post:
      summary: Add a new person
      operationId: createPerson
      tags:
        - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Person"
            examples:
              example1:
                summary: Example of person 1
                value:
                  firstName: "Javier"
                  lastName: "Sanz"
                  pass: "0f3fde0103dd44077c040215a2fabd09a097aecc"
                  email: "correofalso123@apieventos.com"
                  age: 28
                  height: 1.75
                  interests: "Tech, 3D, videogames, etc"
                  birthDate: "1996-05-29"
                  verified: true
              example2:
                summary: Example of person 2
                value:
                  firstName: "Montse"
                  lastName: "García"
                  pass: "0f3fde0103dd44077c040215a2fabd09a097aecc"
                  email: "correofalso321@apieventos.com"
                  age: 28
                  height: 1.58
                  interests: "Pixar, Disney, etc"
                  birthDate: "1996-07-11"
                  verified: false
      responses:
        "201":
          description: Person added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonWithoutPass"
              examples:
                example1:
                  summary: Example of person 1
                  value:
                    id: 1
                    firstName: "Javier"
                    lastName: "Sanz"
                    email: "correofalso123@apieventos.com"
                    age: 28
                    height: 1.75
                    interests: "Tech, 3D, videogames, etc"
                    birthDate: "1996-05-29"
                    verified: true
                example2:
                  summary: Example of person 2
                  value:
                    id: 2
                    firstName: "Montse"
                    lastName: "García"
                    email: "correofalso321@apieventos.com"
                    age: 28
                    height: 1.58
                    interests: "Pixar, Disney, etc"
                    birthDate: "1996-07-11"
                    verified: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                example1:
                  summary: Example of error response
                  value:
                    status: 400
                    error: "MethodArgumentNotValidException"
                    message: "[Height must be greater than or equal to 0]"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                example1:
                  summary: Example of error response
                  value:
                    status: 500
                    error: "DataAccessResourceFailureException"
                    message: "An unexpected internal error occurred"
  
