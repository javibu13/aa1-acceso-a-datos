components:
  schemas:
    Person:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: "Javier"
        lastName:
          type: string
          example: "Sanz"
        email:
          type: string
          example: correofalso123@apieventos.com
        pass:
          type: string
          example: "0f3fde0103dd44077c040215a2fabd09a097aecc"
        age:
          type: integer
          example: 30
        height:
          type: number
          format: float
          example: 1.75
        interests:
          type: string
          example: "Tech, 3D, videogames, etc"
        birthDate:
          type: string
          format: date
          example: "1996-05-29"
        verified:
          type: boolean
          example: true

    PersonWithoutPass:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: "Javier"
        lastName:
          type: string
          example: "Sanz"
        email:
          type: string
          example: correofalso123@apieventos.com
        age:
          type: integer
          example: 30
        height:
          type: number
          format: float
          example: 1.75
        interests:
          type: string
          example: "Tech, 3D, videogames, etc"
        birthDate:
          type: string
          format: date
          example: "1996-05-29"
        verified:
          type: boolean
          example: true

    Place:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Puerto Venecia"
        address:
          type: string
          example: "Calle Teatro Malibrán, 1, 50001 Zaragoza"
        capacity:
          type: integer
          example: 30
        area:
          type: number
          format: float
          example: 400.5
        inaugurationDate:
          type: string
          format: date
          example: "2015-02-01"
        hasParking:
          type: boolean
          example: true
        equipment:
          type: string
          example: "Altavoces, pantallas, proyector, etc"

    Conference:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "3D Printing Day"
        capacity:
          type: integer
          example: 40
        budget:
          type: number
          format: float
          example: 2000.5
        online:
          type: boolean
          example: true
        startDate:
          type: string
          format: date-time
          example: "2025-07-11"
        place:
          $ref: "#/components/schemas/Place"
        organizer:
          $ref: "#/components/schemas/PersonWithoutPass"

    Activity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Limpieza y mantenimiento de impresoras 3D"
        duration:
          type: integer
          example: 90
        price:
          type: number
          format: float
          example: 50.0
        open:
          type: boolean
          example: true
        schedule:
          type: string
          format: date-time
          example: "2025-07-11T10:00:00Z"
        conference:
          $ref: "#/components/schemas/Conference"
      
    Attendance:
      type: object
      properties:
        id:
          type: integer
          example: 1
        ticketCode:
          type: string
          example: "decc4d45-ce13-4925-8675-b89382ed255b"
        seatNumber:
          type: integer
          example: 5
        ticketPrice:
          type: number
          format: float
          example: 50.0
        checkedIn:
          type: boolean
          example: false
        registrationDate:
          type: string
          format: date-time
          example: "2025-04-02T10:00:00Z"
        person:
          $ref: "#/components/schemas/PersonWithoutPass"
        conference:
          $ref: "#/components/schemas/Conference"

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "IllegalArgumentException"
        message:
          type: string
          example: "Error found in the persons request"