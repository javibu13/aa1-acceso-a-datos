          in: path
          required: true
          schema:
            type: integer
          description: ID of the attendance record to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendance"
      responses:
        "202":
          description: Attendance record updated successfully
          content:
