              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Add a new attendance record
      operationId: createAttendance
      tags:
        - Attendances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attendance"
      responses:
        "201":
          description: Attendance record added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
