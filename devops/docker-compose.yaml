name: 'apieventos'

services:
  mysql:
    image: 'mysql:9.2.0'
    environment:
      - 'MYSQL_DATABASE=apieventos_db'
      - 'MYSQL_USER=user'
      - 'MYSQL_PASSWORD=pass'
      - 'MYSQL_ROOT_PASSWORD=SuperSecretPassword'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dbCreation.sql:/docker-entrypoint-initdb.d/dbCreation.sql
    ports:
      - 3306:3306

  api:
    build:
      context: ../
      dockerfile: ./devops/Dockerfile.api
    ports:
      - 8081:8080
    depends_on:
      - mysql
    command: ["mvn", "spring-boot:run"]

volumes:
  mysql_data: